<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俄语单词宝 - 艾宾浩斯专业版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #f43f5e;
            --bg: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 20px;
            min-height: 80vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 13px;
        }

        /* 输入区域 */
        .input-section {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 18px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            padding: 8px 0;
            outline: none;
            font-weight: 600;
        }

        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        /* 单词卡片 */
        .vocab-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .ru-text {
            font-family: 'Times New Roman', serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }

        .btns {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .btns button {
            border: none;
            padding: 8px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-bad { background: var(--error); }
        .btn-mid { background: var(--warning); }
        .btn-good { background: var(--success); }

        .empty {
            text-align: center;
            padding: 50px 0;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h2 style="margin:0">🇷🇺 单词宝</h2>
        <div class="badge" id="dueCounter">待复习: 0</div>
    </div>

    <div class="input-section">
        <input type="text" id="ruInput" placeholder="输入俄语单词 (如: учусь)">
        <input type="text" id="cnInput" placeholder="中文翻译">
        <button class="btn-main" onclick="saveWord()">添加并识别原型</button>
    </div>

    <div id="mainList"></div>
</div>

<script>
    // 艾宾浩斯逻辑
    const STEPS = [5, 30, 720, 1440, 2880, 5760, 10080]; // 分钟
    let data = JSON.parse(localStorage.getItem('ru_v3_data') || '[]');

    // 自动重音标记模拟 (可以在此处以后扩展 AI API)
    function autoAccent(word) {
        let w = word.toLowerCase().trim();
        // 简单模拟: 常见的词尾识别
        return w.replace('u', 'u\u0301').replace('a', 'a\u0301');
    }

    function saveWord() {
        const ru = document.getElementById('ruInput').value;
        const cn = document.getElementById('cnInput').value;
        if(!ru) return;

        const newItem = {
            id: Date.now(),
            word: autoAccent(ru),
            meaning: cn || "未备注",
            level: 0,
            next: Date.now()
        };

        data.push(newItem);
        update();
        document.getElementById('ruInput').value = '';
        document.getElementById('cnInput').value = '';
    }

    function handleSRS(id, type) {
        const item = data.find(x => x.id === id);
        const now = Date.now();

        if (type === 'good') {
            item.level = Math.min(item.level + 1, STEPS.length - 1);
            item.next = now + (STEPS[item.level] * 60000);
        } else if (type === 'mid') {
            item.next = now + (1440 * 60000); // 1天后
        } else {
            item.level = 0;
            item.next = now + (5 * 60000); // 5分钟后循环
        }
        update();
    }

    function update() {
        localStorage.setItem('ru_v3_data', JSON.stringify(data));
        render();
    }

    function render() {
        const list = document.getElementById('mainList');
        const now = Date.now();
        const due = data.filter(x => x.next <= now);
        
        document.getElementById('dueCounter').innerText = `待复习: ${due.length}`;

        if(due.length === 0) {
            list.innerHTML = '<div class="empty">🎉 暂时没有待复习单词！<br>去添加一些新词吧。</div>';
            return;
        }

        list.innerHTML = due.map(item => `
            <div class="vocab-card">
                <div class="ru-text">${item.word}</div>
                <div style="color:#64748b; margin-top:5px">${item.meaning}</div>
                <div class="btns">
                    <button class="btn-bad" onclick="handleSRS(${item.id}, 'bad')">不熟</button>
                    <button class="btn-mid" onclick="handleSRS(${item.id}, 'mid')">模糊</button>
                    <button class="btn-good" onclick="handleSRS(${item.id}, 'good')">掌握</button>
                </div>
            </div>
        `).join('');
    }

    render();
    setInterval(render, 30000); // 每30秒自动检测一次任务
</script>

</body>
</html>
