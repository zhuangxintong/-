<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄语背诵达人 - 艾宾浩斯云端版</title>
    <!-- 引入 Tailwind CSS 用于样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        body { background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 添加 data-type="module" 以支持 import 语句并防止 Babel 转换成 require -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;

        // --- Firebase 模块导入 (使用 CDN 版本) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 环境配置 ---
        // 使用 window 显式访问全局注入的变量
        const firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'ru-vocab-app';
        const apiKey = ""; // Gemini API Key 运行时自动注入

        // 艾宾浩斯间隔（小时）
        const REVIEW_INTERVALS = {
            unfamiliar: 1,    // 不熟：1小时后
            uncertain: 24,    // 不确定：24小时后
            mastered: 168,    // 掌握：7天后
        };

        // 图标组件 (使用内置 SVG 避免外部依赖)
        const IconSpeaker = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [words, setWords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [inputText, setInputText] = useState('');
            const [isAdding, setIsAdding] = useState(false);
            const [mode, setMode] = useState('review'); // 'review' or 'list'
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);

            // 1. 认证
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth initialization failed:", err);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // 2. 数据监听
            useEffect(() => {
                if (!user) return;
                const q = collection(db, 'artifacts', appId, 'users', user.uid, 'vocabulary');
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
                    setWords(data);
                    setLoading(false);
                }, (err) => {
                    console.error("Firestore Error:", err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user]);

            // 3. AI 自动生成词卡
            const generateCard = async (word) => {
                const prompt = `Act as a Russian teacher. For the word "${word}", provide:
                1. wordWithStress: word with Unicode acute accent on stressed vowel.
                2. definition: Chinese meaning.
                3. exampleRu: One simple Russian example sentence.
                4. exampleZh: Chinese translation of example.
                Return ONLY JSON: {"wordWithStress":"","definition":"","exampleRu":"","exampleZh":""}`;

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: prompt }] }], 
                            generationConfig: { responseMimeType: "application/json" } 
                        })
                    });
                    const json = await res.json();
                    return JSON.parse(json.candidates[0].content.parts[0].text);
                } catch (e) {
                    console.error("AI Generation Error", e);
                    return null;
                }
            };

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!inputText.trim() || isAdding) return;
                setIsAdding(true);
                const data = await generateCard(inputText.trim());
                if (data && user) {
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'vocabulary'), {
                        ...data,
                        original: inputText.trim(),
                        nextReview: Date.now(),
                        level: 'new',
                        createdAt: Date.now()
                    });
                    setInputText('');
                    setMode('review');
                }
                setIsAdding(false);
            };

            const updateStatus = async (wordId, status) => {
                const interval = REVIEW_INTERVALS[status] * 60 * 60 * 1000;
                const nextTime = Date.now() + interval;
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'vocabulary', wordId), {
                    level: status,
                    nextReview: nextTime
                });
                setIsFlipped(false);
                // 如果是最后一个词，重置索引回到开头（或在界面提示已扫完）
                if (currentIndex >= reviewQueue.length - 1) {
                    setCurrentIndex(0);
                }
            };

            const speak = (text) => {
                if (!text) return;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                window.speechSynthesis.speak(utterance);
            };

            const reviewQueue = useMemo(() => {
                return words
                    .filter(w => w.nextReview <= Date.now())
                    .sort((a,b) => a.nextReview - b.nextReview);
            }, [words]);

            if (loading) return (
                <div className="flex h-screen items-center justify-center bg-slate-50 text-slate-500 font-medium">
                    正在同步云端词库...
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-50 shadow-lg">
                    {/* Header */}
                    <header className="bg-white p-4 border-b flex justify-between items-center sticky top-0 z-20 shadow-sm">
                        <h1 className="text-xl font-bold text-indigo-600 tracking-tight">俄语背诵达人</h1>
                        <div className="flex gap-1">
                            <button 
                                onClick={() => {setMode('review'); setIsFlipped(false);}} 
                                className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${mode === 'review' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-100'}`}
                            >
                                复习
                            </button>
                            <button 
                                onClick={() => setMode('list')} 
                                className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${mode === 'list' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-100'}`}
                            >
                                词库
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow p-4">
                        {mode === 'review' ? (
                            <div className="space-y-6">
                                <div className="text-center text-sm font-semibold text-slate-400">
                                    待复习: <span className="text-indigo-600">{reviewQueue.length}</span> 词
                                </div>
                                {reviewQueue.length > 0 ? (
                                    <div className="space-y-6">
                                        <div className="relative h-80 perspective-1000">
                                            <div 
                                                onClick={() => setIsFlipped(!isFlipped)}
                                                className={`w-full h-full transition-all duration-500 preserve-3d cursor-pointer relative ${isFlipped ? 'rotate-y-180' : ''}`}
                                            >
                                                {/* 正面 */}
                                                <div className="absolute inset-0 bg-white shadow-xl rounded-3xl border border-slate-100 flex flex-col items-center justify-center p-6 backface-hidden">
                                                    <div className="text-4xl font-bold mb-6 text-slate-800 tracking-wide">
                                                        {reviewQueue[currentIndex]?.wordWithStress}
                                                    </div>
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); speak(reviewQueue[currentIndex]?.original); }} 
                                                        className="p-4 bg-indigo-50 rounded-full text-indigo-600 hover:scale-110 transition-transform shadow-sm"
                                                    >
                                                        <IconSpeaker />
                                                    </button>
                                                    <div className="mt-12 text-slate-300 text-xs font-medium">点击卡片翻看释义</div>
                                                </div>
                                                {/* 反面 */}
                                                <div className="absolute inset-0 bg-white shadow-xl rounded-3xl border border-indigo-50 flex flex-col p-8 backface-hidden rotate-y-180 overflow-y-auto">
                                                    <div className="mb-6">
                                                        <div className="text-[10px] uppercase tracking-widest text-indigo-400 font-black mb-1">释义</div>
                                                        <div className="text-2xl font-bold text-slate-800">{reviewQueue[currentIndex]?.definition}</div>
                                                    </div>
                                                    <div className="flex-grow">
                                                        <div className="text-[10px] uppercase tracking-widest text-emerald-400 font-black mb-1">例句</div>
                                                        <div className="text-lg text-slate-700 italic font-serif leading-relaxed mb-2">
                                                            {reviewQueue[currentIndex]?.exampleRu}
                                                        </div>
                                                        <div className="text-sm text-slate-500 leading-relaxed">
                                                            {reviewQueue[currentIndex]?.exampleZh}
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); speak(reviewQueue[currentIndex]?.exampleRu); }} 
                                                        className="self-center p-4 bg-emerald-50 rounded-full text-emerald-600 hover:scale-110 transition-transform shadow-sm mt-4"
                                                    >
                                                        <IconSpeaker />
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {isFlipped && (
                                            <div className="grid grid-cols-3 gap-3 animate-in fade-in slide-in-from-bottom-2">
                                                <button onClick={() => updateStatus(reviewQueue[currentIndex].id, 'unfamiliar')} className="p-4 bg-rose-50 text-rose-600 rounded-2xl text-xs font-black uppercase hover:bg-rose-100 transition-colors">不熟</button>
                                                <button onClick={() => updateStatus(reviewQueue[currentIndex].id, 'uncertain')} className="p-4 bg-amber-50 text-amber-600 rounded-2xl text-xs font-black uppercase hover:bg-amber-100 transition-colors">不确定</button>
                                                <button onClick={() => updateStatus(reviewQueue[currentIndex].id, 'mastered')} className="p-4 bg-emerald-50 text-emerald-600 rounded-2xl text-xs font-black uppercase hover:bg-emerald-100 transition-colors">掌握</button>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="bg-white p-12 rounded-3xl border border-slate-100 text-center shadow-sm">
                                        <div className="text-5xl mb-6">🎯</div>
                                        <div className="font-bold text-slate-800 text-lg">今日复习任务已全部完成！</div>
                                        <p className="text-slate-400 text-sm mt-2">保持节奏，去词库添加更多单词吧。</p>
                                        <button 
                                            onClick={() => setMode('list')} 
                                            className="mt-8 bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold shadow-md shadow-indigo-200 active:scale-95 transition-transform"
                                        >
                                            前往词库
                                        </button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                    <h3 className="text-sm font-black text-slate-800 mb-4 uppercase tracking-wider">添加新词</h3>
                                    <form onSubmit={handleAdd} className="flex gap-2">
                                        <input 
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            placeholder="输入俄语原词 (如: работа)"
                                            className="flex-grow px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
                                        />
                                        <button 
                                            disabled={isAdding || !inputText.trim()} 
                                            className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold disabled:opacity-50 shadow-md shadow-indigo-100 active:scale-95 transition-all"
                                        >
                                            {isAdding ? '生成中' : '添加'}
                                        </button>
                                    </form>
                                    <p className="text-[10px] text-slate-400 mt-3 italic">AI 会自动补全重音、中文释义和标准例句</p>
                                </div>

                                <div className="space-y-3">
                                    <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest px-1">已收录词汇 ({words.length})</h3>
                                    {words.length === 0 ? (
                                        <div className="text-center py-20 text-slate-300 italic text-sm">还没有单词，开启你的俄语之旅吧</div>
                                    ) : (
                                        <div className="space-y-2">
                                            {words.sort((a,b) => b.createdAt - a.createdAt).map(word => (
                                                <div key={word.id} className="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center group hover:border-indigo-200 transition-colors shadow-sm">
                                                    <div className="flex flex-col">
                                                        <div className="flex items-center gap-2">
                                                            <span className="font-bold text-slate-800">{word.wordWithStress}</span>
                                                            <button onClick={() => speak(word.original)} className="text-slate-300 hover:text-indigo-400 transition-colors">
                                                                <IconSpeaker />
                                                            </button>
                                                        </div>
                                                        <div className="text-xs text-slate-500">{word.definition}</div>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-2 h-2 rounded-full ${
                                                            word.level === 'mastered' ? 'bg-emerald-400' : 
                                                            word.level === 'uncertain' ? 'bg-amber-400' : 
                                                            word.level === 'unfamiliar' ? 'bg-rose-400' : 'bg-slate-200'
                                                        }`}></div>
                                                        <button 
                                                            onClick={() => deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'vocabulary', word.id))} 
                                                            className="text-slate-200 hover:text-rose-500 font-bold p-1 opacity-0 group-hover:opacity-100 transition-opacity"
                                                        >
                                                            &times;
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                    
                    {/* Spacer for bottom nav mobile */}
                    <div className="h-10"></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
