<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俄语单词宝 - 艾宾浩斯复习</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --indigo: #4f46e5;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --slate-50: #f8fafc;
            --slate-200: #e2e8f0;
            --slate-800: #1e293b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--slate-50);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--slate-800);
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 24px;
            border-radius: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 { font-size: 20px; font-weight: 800; margin: 0; }

        .stat-badge {
            background: #eef2ff;
            color: var(--indigo);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }

        /* 输入框样式 */
        .input-box {
            background: var(--slate-50);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 700;
            outline: none;
            padding: 8px 0;
            box-sizing: border-box;
        }

        .btn-add {
            width: 100%;
            background: var(--indigo);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-weight: 800;
            margin-top: 10px;
            cursor: pointer;
        }

        /* 单词卡片样式 */
        .card {
            background: white;
            border: 1px solid var(--slate-200);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .russian-word {
            font-family: 'Times New Roman', serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--indigo);
        }

        .meaning {
            font-size: 16px;
            color: #64748b;
            margin: 8px 0;
            font-weight: 600;
        }

        /* 记忆按钮组 */
        .action-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-sm {
            border: none;
            padding: 10px 4px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            color: white;
            cursor: pointer;
        }

        .btn-red { background: var(--rose); }
        .btn-orange { background: var(--amber); }
        .btn-green { background: var(--emerald); }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🇷🇺 俄语单词宝</h1>
        <div class="stat-badge" id="dueCount">待复习: 0</div>
    </header>

    <div class="input-box">
        <input type="text" id="wordIn" placeholder="输入单词 (如: учусь)">
        <input type="text" id="transIn" placeholder="中文翻译">
        <button class="btn-add" onclick="addWord()">添加并识别原型</button>
    </div>

    <div id="reviewList">
        </div>
</div>

<script>
    // 艾宾浩斯间隔（分钟）: 5, 30, 12h, 1d, 2d, 4d, 7d, 15d
    const INTERVALS = [5, 30, 720, 1440, 2880, 5760, 10080, 21600];
    
    let db = JSON.parse(localStorage.getItem('ru_vocab_v4') || '[]');

    // 简化的原型识别（用于演示，可替换为 API）
    function lemmatize(word) {
        let w = word.toLowerCase().trim();
        // 模拟识别：如果输入变体，返回带重音的原型
        if (w === 'учусь') return 'учи\u0301ться';
        if (w === 'книгу') return 'кни\u0301га';
        return w; 
    }

    function addWord() {
        const wordVal = document.getElementById('wordIn').value;
        const transVal = document.getElementById('transIn').value;
        if (!wordVal) return;

        const wordObj = {
            id: Date.now(),
            word: lemmatize(wordVal),
            translation: transVal || "暂无释义",
            level: 0,
            nextReview: Date.now() 
        };

        db.push(wordObj);
        saveAndRender();
        document.getElementById('wordIn').value = '';
        document.getElementById('transIn').value = '';
    }

    function handleMemory(id, type) {
        const item = db.find(w => w.id === id);
        const now = Date.now();

        if (type === 'master') {
            item.level = Math.min(item.level + 1, INTERVALS.length - 1);
            item.nextReview = now + (INTERVALS[item.level] * 60000);
        } else if (type === 'unsure') {
            item.level = Math.max(0, item.level - 1);
            item.nextReview = now + (1440 * 60000); // 1天后
        } else {
            item.level = 0;
            item.nextReview = now + (5 * 60000); // 5分钟后
        }

        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('ru_vocab_v4', JSON.stringify(db));
        render();
    }

    function render() {
        const list = document.getElementById('reviewList');
        const now = Date.now();
        const dueWords = db.filter(w => w.nextReview <= now);
        
        document.getElementById('dueCount').innerText = `待复习: ${dueWords.length}`;

        if (dueWords.length === 0) {
            list.innerHTML = `<div class="empty-state">🎉 太棒了！<br>目前没有待复习的单词。</div>`;
            return;
        }

        list.innerHTML = dueWords.map(w => `
            <div class="card">
                <div class="russian-word">${w.word}</div>
                <div class="meaning">${w.translation}</div>
                <div class="action-group">
                    <button class="btn-sm btn-red" onclick="handleMemory(${w.id}, 'forget')">不熟(5分后)</button>
                    <button class="btn-sm btn-orange" onclick="handleMemory(${w.id}, 'unsure')">不确定(1天后)</button>
                    <button class="btn-sm btn-green" onclick="handleMemory(${w.id}, 'master')">掌握(升级)</button>
                </div>
            </div>
        `).join('');
    }

    // 初始化渲染
    render();
    // 每分钟检查一次是否有新的“5分钟复习”到期
    setInterval(render, 60000);
</script>

</body>
</html>
