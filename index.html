<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄语背诵达人 - 旅俄必备</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        body { background-color: #f8fafc; font-family: -apple-system, system-ui, sans-serif; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 环境配置读取 ---
        const USER_CONFIG = ''; 
        let firebaseConfig = {};
        try {
            const rawConfig = window.__firebase_config || USER_CONFIG;
            firebaseConfig = rawConfig ? JSON.parse(rawConfig) : {};
        } catch(e) { console.error("Firebase Config Error"); }

        const isCloudEnabled = !!firebaseConfig.apiKey;
        const app = isCloudEnabled ? initializeApp(firebaseConfig) : null;
        const auth = app ? getAuth(app) : null;
        const db = app ? getFirestore(app) : null;
        const appId = window.__app_id || 'ru-vocabulary-pro';

        const REVIEW_INTERVALS = { unfamiliar: 1, uncertain: 24, mastered: 168 };

        const IconSpeaker = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [words, setWords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [inputText, setInputText] = useState('');
            const [isAdding, setIsAdding] = useState(false);
            const [mode, setMode] = useState('review');
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            
            // API Key 管理：优先从 localStorage 读取，其次是环境变量
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_api_key') || '');

            // 1. 登录与数据加载
            useEffect(() => {
                if (!isCloudEnabled) {
                    const localData = localStorage.getItem('ru_words_local');
                    if (localData) setWords(JSON.parse(localData));
                    setLoading(false);
                    return;
                }
                const initAuth = async () => {
                    try {
                        if (window.__initial_auth_token) await signInWithCustomToken(auth, window.__initial_auth_token);
                        else await signInAnonymously(auth);
                    } catch (err) { console.error("Auth failed", err); }
                };
                initAuth();
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!isCloudEnabled) {
                    localStorage.setItem('ru_words_local', JSON.stringify(words));
                    return;
                }
                if (!user || !db) return;
                const q = collection(db, 'artifacts', appId, 'users', user.uid, 'vocabulary');
                return onSnapshot(q, (snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
                    setWords(data);
                    setLoading(false);
                }, (err) => setLoading(false));
            }, [user, words]);

            // 2. AI 生成核心逻辑
            const generateCard = async (word) => {
                if (!geminiKey) {
                    setErrorMsg('请先在设置中填写 Gemini API Key');
                    return null;
                }
                setErrorMsg('');
                const prompt = `Act as a Russian teacher. For "${word}", provide JSON: {"wordWithStress":"(Unicode acute accent on stressed vowel)","definition":"(ZH)","exampleRu":"","exampleZh":""}`;
                
                try {
                    // 使用标准的 Gemini 1.5 Flash 模型，更适合 Vercel 部署
                    const modelName = "gemini-1.5-flash"; 
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${geminiKey}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || '请求失败');
                    }

                    const json = await response.json();
                    const resultText = json.candidates[0].content.parts[0].text;
                    return JSON.parse(resultText);
                } catch (e) {
                    setErrorMsg(`生成失败: ${e.message}。如果在俄罗斯，请确保开启了代理。`);
                    return null;
                }
            };

            const handleAdd = async (e) => {
                e.preventDefault();
                const word = inputText.trim();
                if (!word || isAdding) return;
                setIsAdding(true);
                const data = await generateCard(word);
                if (data) {
                    const newWord = {
                        ...data,
                        id: Date.now().toString(),
                        original: word,
                        nextReview: Date.now(),
                        level: 'new',
                        createdAt: Date.now()
                    };
                    if (isCloudEnabled && user) {
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'vocabulary'), newWord);
                    } else {
                        setWords([...words, newWord]);
                    }
                    setInputText('');
                    setMode('review');
                }
                setIsAdding(false);
            };

            const updateStatus = async (wordId, status) => {
                const interval = REVIEW_INTERVALS[status] * 60 * 60 * 1000;
                const nextTime = Date.now() + interval;
                if (isCloudEnabled && user) {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'vocabulary', wordId), {
                        level: status, nextReview: nextTime
                    });
                } else {
                    setWords(words.map(w => w.id === wordId ? { ...w, level: status, nextReview: nextTime } : w));
                }
                setIsFlipped(false);
                if (currentIndex >= reviewQueue.length - 1) setCurrentIndex(0);
            };

            const speak = (text) => {
                if (!text) return;
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = 'ru-RU';
                window.speechSynthesis.speak(ut);
            };

            const reviewQueue = useMemo(() => {
                return words.filter(w => w.nextReview <= Date.now()).sort((a,b) => a.nextReview - b.nextReview);
            }, [words]);

            const saveApiKey = (key) => {
                setGeminiKey(key);
                localStorage.setItem('gemini_api_key', key);
            };

            if (loading) return <div className="flex h-screen items-center justify-center text-slate-400">正在准备...</div>;

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-2xl relative overflow-hidden">
                    
                    {/* 错误提示条 */}
                    {errorMsg && (
                        <div className="bg-rose-500 text-white text-[10px] py-2 px-4 text-center font-bold sticky top-0 z-50 animate-fade-in flex justify-between items-center">
                            <span>{errorMsg}</span>
                            <button onClick={() => setErrorMsg('')}>✕</button>
                        </div>
                    )}

                    {!isCloudEnabled && !errorMsg && (
                        <div className="bg-amber-100 text-amber-800 text-[10px] py-1 text-center font-bold sticky top-0 z-30">
                            本地模式：数据保存在浏览器。配置 Firebase 可开启云同步。
                        </div>
                    )}

                    <header className="bg-white p-4 border-b flex justify-between items-center sticky top-0 z-20 shadow-sm">
                        <h1 className="text-xl font-black text-indigo-600">俄语背诵</h1>
                        <div className="flex bg-slate-100 p-1 rounded-xl">
                            <button onClick={() => setMode('review')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${mode === 'review' ? 'bg-white shadow text-indigo-600' : 'text-slate-400'}`}>学习</button>
                            <button onClick={() => setMode('list')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${mode === 'list' ? 'bg-white shadow text-indigo-600' : 'text-slate-400'}`}>词库</button>
                        </div>
                    </header>

                    <main className="flex-grow p-4">
                        {mode === 'review' ? (
                            <div className="space-y-6">
                                <div className="text-center text-xs font-bold text-slate-400 uppercase tracking-widest">今日复习: {reviewQueue.length}</div>
                                {reviewQueue.length > 0 ? (
                                    <div className="space-y-6">
                                        <div className="relative h-80 perspective-1000" onClick={() => setIsFlipped(!isFlipped)}>
                                            <div className={`w-full h-full transition-all duration-500 preserve-3d relative ${isFlipped ? 'rotate-y-180' : ''}`}>
                                                <div className="absolute inset-0 bg-white shadow-xl rounded-3xl border border-slate-100 flex flex-col items-center justify-center p-6 backface-hidden">
                                                    <div className="text-4xl font-black text-slate-800 mb-6 text-center">{reviewQueue[currentIndex]?.wordWithStress}</div>
                                                    <button onClick={(e) => { e.stopPropagation(); speak(reviewQueue[currentIndex]?.original); }} className="p-4 bg-indigo-50 rounded-full text-indigo-600 hover:scale-110 active:scale-95 transition-all shadow-sm"><IconSpeaker /></button>
                                                </div>
                                                <div className="absolute inset-0 bg-white shadow-xl rounded-3xl border border-indigo-50 flex flex-col p-8 backface-hidden rotate-y-180">
                                                    <div className="mb-4">
                                                        <div className="text-[10px] font-black text-indigo-400 mb-1 tracking-widest uppercase">释义</div>
                                                        <div className="text-2xl font-bold text-slate-900">{reviewQueue[currentIndex]?.definition}</div>
                                                    </div>
                                                    <div className="flex-grow overflow-y-auto">
                                                        <div className="text-[10px] font-black text-emerald-400 mb-1 tracking-widest uppercase">例句</div>
                                                        <div className="text-lg text-slate-700 italic leading-snug mb-2 font-serif">{reviewQueue[currentIndex]?.exampleRu}</div>
                                                        <div className="text-xs text-slate-400">{reviewQueue[currentIndex]?.exampleZh}</div>
                                                    </div>
                                                    <button onClick={(e) => { e.stopPropagation(); speak(reviewQueue[currentIndex]?.exampleRu); }} className="self-center p-4 bg-emerald-50 rounded-full text-emerald-600 mt-4"><IconSpeaker /></button>
                                                </div>
                                            </div>
                                        </div>
                                        {isFlipped && (
                                            <div className="grid grid-cols-3 gap-3 animate-in fade-in">
                                                <button onClick={() => updateStatus(reviewQueue[currentIndex].id, 'unfamiliar')} className="p-4 bg-rose-50 border border-rose-100 text-rose-600 rounded-2xl text-[10px] font-black uppercase shadow-sm">不熟</button>
                                                <button onClick={() => updateStatus(reviewQueue[currentIndex].id, 'uncertain')} className="p-4 bg-amber-50 border border-amber-100 text-amber-600 rounded-2xl text-[10px] font-black uppercase shadow-sm">模糊</button>
                                                <button onClick={() => updateStatus(reviewQueue[currentIndex].id, 'mastered')} className="p-4 bg-emerald-50 border border-emerald-100 text-emerald-600 rounded-2xl text-[10px] font-black uppercase shadow-sm">掌握</button>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="bg-white p-12 rounded-3xl border border-slate-100 text-center shadow-sm">
                                        <div className="text-5xl mb-6">🎯</div>
                                        <div className="font-bold text-slate-800 text-lg">暂无复习任务</div>
                                        <button onClick={() => setMode('list')} className="mt-8 bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg shadow-indigo-100 active:scale-95 transition-all">前往词库</button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="space-y-6">
                                {/* API Key 设置区 */}
                                {!geminiKey && (
                                    <div className="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 animate-fade-in">
                                        <h4 className="text-xs font-bold text-indigo-600 mb-2 uppercase tracking-tighter">设置 AI 密钥 (Gemini API Key)</h4>
                                        <div className="flex gap-2">
                                            <input 
                                                type="password"
                                                placeholder="在此粘贴密钥..." 
                                                className="flex-grow px-3 py-2 text-xs rounded-lg border border-indigo-200 focus:outline-none"
                                                onBlur={(e) => saveApiKey(e.target.value)}
                                            />
                                            <button className="bg-indigo-600 text-white text-[10px] px-3 rounded-lg font-bold">确定</button>
                                        </div>
                                        <p className="text-[10px] text-indigo-400 mt-2">密钥仅保存在本地浏览器，用于自动生成词卡。</p>
                                    </div>
                                )}

                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                    <form onSubmit={handleAdd} className="flex gap-2">
                                        <input value={inputText} onChange={(e) => setInputText(e.target.value)} placeholder="输入俄语单词 (如: семья)" className="flex-grow px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" />
                                        <button disabled={isAdding || !inputText.trim()} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold disabled:opacity-50 shadow-md active:scale-95 transition-all">
                                            {isAdding ? '生成' : '添加'}
                                        </button>
                                    </form>
                                </div>
                                
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center px-1">
                                        <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest">词库 ({words.length})</h3>
                                        {geminiKey && <button onClick={() => { if(confirm('重置 API Key?')) saveApiKey(''); }} className="text-[10px] text-slate-300">重置密钥</button>}
                                    </div>
                                    {words.slice().reverse().map(word => (
                                        <div key={word.id} className="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center group">
                                            <div>
                                                <div className="font-bold text-slate-800 flex items-center gap-2">
                                                    {word.wordWithStress}
                                                    <button onClick={() => speak(word.original)} className="text-slate-200 hover:text-indigo-400"><IconSpeaker /></button>
                                                </div>
                                                <div className="text-xs text-slate-400">{word.definition}</div>
                                            </div>
                                            <button onClick={() => {
                                                if(confirm('确定删除？')) {
                                                    if(isCloudEnabled && user) deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'vocabulary', word.id));
                                                    else setWords(words.filter(w => w.id !== word.id));
                                                }
                                            }} className="text-slate-200 hover:text-rose-500 text-xl font-light px-2">×</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
