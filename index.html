<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄语背诵达人 - 俄罗斯华人之选</title>
    <!-- 1. 样式与框架脚本 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 关键修复：使用 data-type="module" 处理外部 import -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;

        // --- Firebase 动态导入 ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 环境安全检查与配置 ---
        // 修复白屏关键：防止 JSON.parse(undefined)
        let firebaseConfig = {};
        try {
            firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        } catch(e) {
            console.warn("未发现预设 Firebase 配置");
        }

        const hasConfig = firebaseConfig.apiKey;
        const app = hasConfig ? initializeApp(firebaseConfig) : null;
        const auth = app ? getAuth(app) : null;
        const db = app ? getFirestore(app) : null;
        const appId = window.__app_id || 'my-russian-app';
        const apiKey = ""; // Gemini API Key 

        const REVIEW_INTERVALS = { unfamiliar: 1, uncertain: 24, mastered: 168 };

        // 图标组件
        const IconSpeaker = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [words, setWords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [inputText, setInputText] = useState('');
            const [isAdding, setIsAdding] = useState(false);
            const [mode, setMode] = useState('review');
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);

            // 如果没有配置，显示配置引导
            if (!hasConfig) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen p-8 text-center bg-white">
                        <div className="text-5xl mb-4">⚙️</div>
                        <h1 className="text-xl font-bold mb-2">欢迎使用俄语背诵达人</h1>
                        <p className="text-slate-500 mb-6 text-sm">此版本为演示版，未检测到 Firebase 云端配置。如需启用云端存储功能，请在 Vercel 中设置环境变量。</p>
                        <div className="bg-slate-50 p-4 rounded-xl text-left text-xs font-mono w-full overflow-auto">
                            1. 在 Vercel 项目设置中找到 Environment Variables<br/>
                            2. 添加变量名: __firebase_config<br/>
                            3. 值为你的 Firebase 配置 JSON 字符串
                        </div>
                    </div>
                );
            }

            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth error", err); }
                };
                initAuth();
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                const q = collection(db, 'artifacts', appId, 'users', user.uid, 'vocabulary');
                return onSnapshot(q, (snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
                    setWords(data);
                    setLoading(false);
                }, (err) => setLoading(false));
            }, [user]);

            const generateCard = async (word) => {
                const prompt = `Act as a Russian teacher. For "${word}", provide: 1. wordWithStress (Unicode acute accent on vowel), 2. definition (ZH), 3. exampleRu, 4. exampleZh. Return ONLY JSON.`;
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                    });
                    const json = await res.json();
                    return JSON.parse(json.candidates[0].content.parts[0].text);
                } catch (e) { return null; }
            };

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!inputText.trim() || isAdding) return;
                setIsAdding(true);
                const data = await generateCard(inputText.trim());
                if (data && user) {
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'vocabulary'), {
                        ...data, original: inputText.trim(), nextReview: Date.now(), level: 'new', createdAt: Date.now()
                    });
                    setInputText('');
                    setMode('review');
                }
                setIsAdding(false);
            };

            const updateStatus = async (wordId, status) => {
                const interval = REVIEW_INTERVALS[status] * 60 * 60 * 1000;
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'vocabulary', wordId), {
                    level: status, nextReview: Date.now() + interval
                });
                setIsFlipped(false);
                if (currentIndex >= reviewQueue.length - 1) setCurrentIndex(0);
            };

            const speak = (text) => {
                if (!text) return;
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = 'ru-RU';
                window.speechSynthesis.speak(ut);
            };

            const reviewQueue = useMemo(() => {
                return words.filter(w => w.nextReview <= Date.now()).sort((a,b) => a.nextReview - b.nextReview);
            }, [words]);

            if (loading) return <div className="flex h-screen items-center justify-center text-slate-400">正在同步...</div>;

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-2xl">
                    <header className="bg-white p-4 border-b flex justify-between items-center sticky top-0 z-20">
                        <h1 className="text-xl font-black text-indigo-600">俄语背诵</h1>
                        <div className="flex bg-slate-100 p-1 rounded-xl">
                            <button onClick={() => setMode('review')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${mode === 'review' ? 'bg-white shadow text-indigo-600' : 'text-slate-400'}`}>学习</button>
                            <button onClick={() => setMode('list')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${mode === 'list' ? 'bg-white shadow text-indigo-600' : 'text-slate-400'}`}>词库</button>
                        </div>
                    </header>

                    <main className="flex-grow p-4">
                        {mode === 'review' ? (
                            <div className="space-y-6">
                                <div className="text-center text-xs font-bold text-slate-400 uppercase tracking-widest">待复习: {reviewQueue.length}</div>
                                {reviewQueue.length > 0 ? (
                                    <div className="space-y-6">
                                        <div className="relative h-80 perspective-1000" onClick={() => setIsFlipped(!isFlipped)}>
                                            <div className={`w-full h-full transition-all duration-500 preserve-3d relative ${isFlipped ? 'rotate-y-180' : ''}`}>
                                                <div className="absolute inset-0 bg-white shadow-xl rounded-3xl border border-slate-100 flex flex-col items-center justify-center p-6 backface-hidden">
                                                    <div className="text-4xl font-black text-slate-800 mb-6">{reviewQueue[currentIndex]?.wordWithStress}</div>
                                                    <button onClick={(e) => { e.stopPropagation(); speak(reviewQueue[currentIndex]?.original); }} className="p-4 bg-indigo-50 rounded-full text-indigo-600"><IconSpeaker /></button>
                                                </div>
                                                <div className="absolute inset-0 bg-white shadow-xl rounded-3xl border border-indigo-50 flex flex-col p-8 backface-hidden rotate-y-180">
                                                    <div className="mb-4">
                                                        <div className="text-[10px] font-black text-indigo-400 mb-1 tracking-tighter uppercase">释义</div>
                                                        <div className="text-2xl font-bold">{reviewQueue[currentIndex]?.definition}</div>
                                                    </div>
                                                    <div className="flex-grow">
                                                        <div className="text-[10px] font-black text-emerald-400 mb-1 tracking-tighter uppercase">例句</div>
                                                        <div className="text-lg text-slate-700 italic leading-snug mb-2">{reviewQueue[currentIndex]?.exampleRu}</div>
                                                        <div className="text-xs text-slate-400">{reviewQueue[currentIndex]?.exampleZh}</div>
                                                    </div>
                                                    <button onClick={(e) => { e.stopPropagation(); speak(reviewQueue[currentIndex]?.exampleRu); }} className="self-center p-4 bg-emerald-50 rounded-full text-emerald-600 mt-4"><IconSpeaker /></button>
                                                </div>
                                            </div>
                                        </div>
                                        {isFlipped && (
                                            <div className="grid grid-cols-3 gap-3">
                                                <button onClick={() => updateStatus(reviewQueue[currentIndex].id, 'unfamiliar')} className="p-4 bg-white border border-rose-100 text-rose-500 rounded-2xl text-xs font-black shadow-sm active:bg-rose-50">不熟</button>
                                                <button onClick={() => updateStatus(reviewQueue[currentIndex].id, 'uncertain')} className="p-4 bg-white border border-amber-100 text-amber-500 rounded-2xl text-xs font-black shadow-sm active:bg-amber-50">模糊</button>
                                                <button onClick={() => updateStatus(reviewQueue[currentIndex].id, 'mastered')} className="p-4 bg-white border border-emerald-100 text-emerald-500 rounded-2xl text-xs font-black shadow-sm active:bg-emerald-50">掌握</button>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="bg-white p-12 rounded-3xl border border-slate-100 text-center">
                                        <div className="text-5xl mb-6">🥂</div>
                                        <div className="font-bold text-slate-800">全部记完啦！</div>
                                        <button onClick={() => setMode('list')} className="mt-6 text-indigo-600 text-sm font-bold">去词库加点新词</button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                    <form onSubmit={handleAdd} className="flex gap-2">
                                        <input value={inputText} onChange={(e) => setInputText(e.target.value)} placeholder="输入俄语原词..." className="flex-grow px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:outline-none" />
                                        <button disabled={isAdding || !inputText.trim()} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold disabled:opacity-50">
                                            {isAdding ? '生成' : '添加'}
                                        </button>
                                    </form>
                                </div>
                                <div className="space-y-2">
                                    {words.map(word => (
                                        <div key={word.id} className="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center">
                                            <div>
                                                <div className="font-bold text-slate-800">{word.wordWithStress}</div>
                                                <div className="text-xs text-slate-400">{word.definition}</div>
                                            </div>
                                            <button onClick={() => deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'vocabulary', word.id))} className="text-slate-200 hover:text-rose-500 text-xl font-light px-2">×</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
